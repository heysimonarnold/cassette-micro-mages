<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Primary metadata -->
    <title>Cassette Micro Mages</title>
    <meta
      name="description"
      content="Cassette Micro Mages est un rendu en 3D en CSS rendant hommage au jeu NES de le compagnie Morphcat."
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://heysimonarnold.github.io/cassette-micro-mages/"
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cassette Micro Mages" />
    <meta property="og:title" content="Cassette Micro Mages" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:description"
      content="Cassette Micro Mages est un dé mécanique transformant le hasard en message venu du futur. Oserez-vous interroger votre avenir?"
    />
    <meta
      property="og:url"
      content="https://heysimonarnold.github.io/cassette-micro-mages/"
    />
    <meta
      property="og:image"
      content="https://heysimonarnold.github.io/cassette-micro-mages/og-image.png"
    />
    <meta
      property="og:image:alt"
      content="Cassette Micro Mages est un dé mécanique transformant le hasard en message venu du futur. Oserez-vous interroger votre avenir?"
    />
  </head>
  <body>
    <div class="cartridge">
      <div class="box body">
        <div class="box body__left">
          <div class="box__side box__side--front"></div>
          <div class="box__side box__side--back"></div>
          <div class="box__side box__side--top"></div>
          <div class="box__side box__side--bottom"></div>
          <div class="box__side box__side--left"></div>
          <div class="box__side box__side--right"></div>
        </div>

        <div class="body__middle">
          <div class="box body__middle__top">
            <div class="box__side box__side--front"></div>
            <div class="box__side box__side--back">
              <div class="stripes"></div>
            </div>
            <div class="box__side box__side--top"></div>
            <div class="box__side box__side--bottom"></div>
            <div class="box__side box__side--left"></div>
            <div class="box__side box__side--right"></div>

            <div class="stripes"></div>
          </div>
          <div class="box body__middle__bottom">
            <div class="box__side box__side--front"></div>
            <div class="box__side box__side--back"></div>
            <div class="box__side box__side--top"></div>
            <div class="box__side box__side--bottom"></div>
            <div class="box__side box__side--left"></div>
            <div class="box__side box__side--right"></div>

            <div class="stripes"></div>
          </div>
        </div>

        <div class="box body__right">
          <div class="box__side box__side--front"></div>
          <div class="box__side box__side--back"></div>
          <div class="box__side box__side--top"></div>
          <div class="box__side box__side--bottom"></div>
          <div class="box__side box__side--left"></div>
          <div class="box__side box__side--right"></div>

          <div class="cartridge__picture"></div>
          <div class="cartridge__triangle"></div>
        </div>

        <div class="back-large"></div>
        <div class="hole hole--1"></div>
        <div class="hole hole--2"></div>
        <div class="hole hole--3"></div>
      </div>

      <div class="box bottom">
        <div class="box__side box__side--front"></div>
        <div class="box__side box__side--back"></div>
        <div class="box__side box__side--top"></div>
        <div class="box__side box__side--bottom"></div>
        <div class="box__side box__side--left"></div>
        <div class="box__side box__side--right"></div>

        <div class="back-small"></div>

        <div class="stripes__wrapper">
          <div class="stripes"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
